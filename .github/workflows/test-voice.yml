name: Test my cloned voice
# Hear your cloned voice before any video uses it: speaks a few sentences in the voice of
# voice/sample.* and keeps the result as a downloadable artifact. Uploads nothing to YouTube.
run-name: "Test my cloned voice (no upload)"

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Hindi = main channel, English = TECH channel"
        type: choice
        options: [Hindi, English]
        default: Hindi
      text:
        description: "What your cloned voice should say (empty = a built-in test sentence in that language)"
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voice-model-chatterbox-0.1.7
      - name: Install
        run: |
          # the same static ffmpeg build the publish workflows use (apt's package list on the runner goes stale)
          mkdir -p "$HOME/ffmpeg"
          if curl -fsSL --retry 3 --max-time 180 \
               https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
             | tar -xJ --strip-components=1 -C "$HOME/ffmpeg"; then
            echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update -qq && sudo apt-get -y -qq --no-install-recommends install ffmpeg
          fi
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-voice.txt
      - name: Speak
        env:
          TEXT: ${{ inputs.text }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          SAMPLE=$(ls voice/sample.* 2>/dev/null | head -1)
          if [ -z "$SAMPLE" ]; then echo "::error::No voice sample yet: upload a 15-30 s clip of your voice as voice/sample.mp3"; exit 1; fi
          mkdir -p out
          # the sample as the pipeline prepares it: gaps closed up and levelled, no noise filter
          ffmpeg -y -loglevel error -i "$SAMPLE" -map 0:a:0 -vn -af "highpass=f=60,silenceremove=start_periods=1:start_threshold=-42dB:stop_periods=-1:stop_duration=0.7:stop_threshold=-42dB,dynaudnorm=f=500:g=31:p=0.7" -t 30 -ar 44100 -ac 1 out/sample.wav
          python - <<'PY'
          import json, os
          builtin = {"Hindi": "किसी ने कभी नहीं पूछा कि उसे नींद क्यों नहीं आती। हर रात वह उसी ठंडे कोने में बैठता था। और बस ऐसे ही, उसे एक घर मिल गया।",
                     "English": "Nobody ever asked why he couldn't sleep. Every night, he chose the same cold corner. And just like that, he had a home."}
          text = os.environ["TEXT"].strip() or builtin[os.environ["LANGUAGE"]]
          json.dump([text], open("out/lines.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          mkdir -p voices
          # the same sentence in four settings: listen and say which number sounds most like you
          speak () {  # name cfg exaggeration temperature
            VOICE_CFG=$2 VOICE_EXAGGERATION=$3 VOICE_TEMPERATURE=$4 python scripts/clone_voice.py out/sample.wav out/lines.json out "$LANGUAGE"
            mv out/line_00.wav "voices/$1.wav"
          }
          speak 1-standard 0.5 0.5 0.8
          speak 2-closer-to-sample 0.8 0.4 0.6
          speak 3-calm-and-steady 0.5 0.3 0.5
          speak 4-more-expressive 0.3 0.75 0.9
          cp out/sample.wav voices/0-your-sample-as-the-model-hears-it.wav
      - uses: actions/upload-artifact@v7
        with:
          name: my-cloned-voice
          path: voices/
          retention-days: 7
