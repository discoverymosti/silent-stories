name: Connect YouTube channel

on:
  # also runs when auth_code.txt (the pasted localhost address) is pushed
  push:
    paths: [auth_code.txt, .github/workflows/connect-youtube.yml]
  workflow_dispatch:
    inputs:
      code:
        description: "Leave empty to get the sign-in link. Then paste the full 'localhost' address here."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Connect
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          AUTH_CODE: ${{ inputs.code }}
        run: |
          pip install -q requests
          if [ -z "$AUTH_CODE" ] && [ -s auth_code.txt ]; then export AUTH_CODE="$(cat auth_code.txt)"; fi
          python scripts/connect_ci.py

      - name: Save encrypted token
        if: hashFiles('yt_token.enc') != ''
        run: |
          git rm -q --ignore-unmatch auth_code.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A yt_token.enc
          git diff --cached --quiet || git commit -m "chore: connect YouTube channel [skip ci]"
          git push
