name: Check free AI providers

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Also test image providers (uses 1 free image each)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # the AI Horde probe alone may take up to 10 minutes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests anthropic
      - name: Check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          CHECK_IMAGES: ${{ inputs.images }}
          # AI tier: free now, paid models only once the channel earns (README: Paid AI later)
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_TIER: ${{ vars.AI_TIER || 'auto' }}
          PAID_MIN_REVENUE_USD: ${{ vars.PAID_MIN_REVENUE_USD }}
          PAID_BUDGET_USD: ${{ vars.PAID_BUDGET_USD }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          FREE_ONLY: ${{ vars.FREE_ONLY }}
        run: python scripts/check_ai.py
