name: Silent Stories - Publish Short

on:
  schedule:
    - cron: "30 12 * * *"   # every day 18:00 IST (prime time for Shorts in India)
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Preview only (render, don't upload)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg (static build, no apt)
        timeout-minutes: 6
        run: |
          set -e
          URL=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          for i in 1 2 3; do
            curl -fsSL --retry 3 --max-time 180 "$URL" -o /tmp/ffmpeg.tar.xz && break
            echo "download attempt $i failed"; sleep 10
          done
          mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
          /tmp/ffmpeg/bin/ffmpeg -hide_banner -filters | grep -E " (ass|zoompan|xfade) " 

      - name: Install fonts (optional)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          timeout 90 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 update -qq || true
          timeout 120 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-noto-core fontconfig || true
          fc-match "Noto Sans:bold" || true

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Make the Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          VISUAL_MODE: ${{ vars.VISUAL_MODE || 'ai' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Silent Stories' }}
          CHANNEL_HASHTAG: ${{ vars.CHANNEL_HASHTAG || '#SilentStories' }}
          SKIP_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || 'false' }}
        run: python scripts/pipeline.py

      - name: Keep video as downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            out/short.mp4
            out/thumbnail.jpg
            out/metadata.json
            out/social.txt
            out/storyboard.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Update story queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add stories.txt done.txt
          git diff --cached --quiet || git commit -m "chore: published next story [skip ci]"
          git push
