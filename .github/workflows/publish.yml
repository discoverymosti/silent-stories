name: Silent Stories - Publish Short

on:
  schedule:
    # times are UTC, chosen for a worldwide audience (evening in Asia/Europe, morning/noon in the Americas)
    - cron: "40 14 * * *"   # every day 14:40 UTC: vertical Short (20:10 IST, 15:40 CET, 10:40 New York)
    - cron: "40 1 * * 1-6"  # Mon-Sat 01:40 UTC: 2nd Short (skipped Sundays to keep the film within the free image budget)
    - cron: "10 16 * * 0"   # every Sunday 16:10 UTC: weekly widescreen short film (12:10 New York)
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Preview only (render, don't upload)"
        type: boolean
        default: true
      format:
        description: "short = daily vertical Short, film = weekly ~3 min short film"
        type: choice
        options: [short, film]
        default: short

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + fonts
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # apt on hosted runners sometimes hangs for 10+ min, so prefer a static build
          FONTS="$HOME/fonts"; mkdir -p "$FONTS" "$HOME/ffmpeg"
          if curl -fsSL --retry 3 --max-time 180 \
               https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
             | tar -xJ --strip-components=1 -C "$HOME/ffmpeg"; then
            echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"; export PATH="$HOME/ffmpeg/bin:$PATH"
          else
            echo "static ffmpeg download failed, falling back to apt"
            sudo rm -f /var/lib/man-db/auto-update
            timeout 300 sudo -E apt-get -o DPkg::Lock::Timeout=60 -y -qq --no-install-recommends install ffmpeg \
              || { timeout 180 sudo apt-get update -qq; timeout 300 sudo -E apt-get -y -qq --no-install-recommends install ffmpeg; }
          fi
          for f in Regular Bold; do
            curl -fsSL --retry 3 --max-time 60 -o "$FONTS/NotoSans-$f.ttf" \
              "https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSans/hinted/ttf/NotoSans-$f.ttf" \
              || rm -f "$FONTS/NotoSans-$f.ttf"
          done
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans*.ttf "$FONTS/" 2>/dev/null || true
          if [ ! -s "$FONTS/NotoSans-Bold.ttf" ]; then
            echo "Noto Sans unavailable, captions use DejaVu Sans"; echo "CAPTION_FONT=DejaVu Sans" >> "$GITHUB_ENV"
          fi
          echo "FONTS_DIR=$FONTS" >> "$GITHUB_ENV"
          ls "$FONTS"
          ffmpeg -hide_banner -filters | grep -q " ass " && echo "ffmpeg ready"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Make the Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          VISUAL_MODE: ${{ vars.VISUAL_MODE || 'ai' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          MAX_FALLBACK_SCENES: ${{ vars.MAX_FALLBACK_SCENES || '2' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'DiscoveryMosti' }}
          CHANNEL_HASHTAG: ${{ vars.CHANNEL_HASHTAG || '#DiscoveryMosti' }}
          VIDEO_FORMAT: ${{ (github.event.schedule == '10 16 * * 0' && 'film') || inputs.format || 'short' }}
          WATERMARK: ${{ vars.WATERMARK || 'DiscoveryMosti' }}
          SKIP_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_upload || 'false' }}
        run: python scripts/pipeline.py

      - name: Cross-post to Instagram, Facebook and X
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.skip_upload)
        continue-on-error: true
        env:
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/crosspost.py

      - name: Keep video as downloadable artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: short-${{ github.run_number }}
          path: |
            out/short.mp4
            out/thumbnail.jpg
            out/metadata.json
            out/social.txt
            out/storyboard.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Update story queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add stories.txt films.txt done.txt
          git diff --cached --quiet || git commit -m "chore: published next story [skip ci]"
          # someone may have edited the queue on github.com during the run
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
