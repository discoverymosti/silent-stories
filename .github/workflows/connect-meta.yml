name: Connect Facebook & Instagram

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Connect
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_PAGE_NAME: ${{ vars.META_PAGE_NAME }}
        run: |
          pip install -q requests
          python scripts/connect_meta.py

      - name: Save encrypted credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add meta_token.enc
          git diff --cached --quiet || git commit -m "chore: connect Facebook & Instagram [skip ci]"
          git pull --rebase -q && git push
